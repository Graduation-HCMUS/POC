name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  workspace-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies and activate hooks
        run: npm ci
      - name: Check workspace
        run: npm run check
